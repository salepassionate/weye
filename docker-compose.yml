services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://weye:weye_dev_password@db:5432/weye
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weye
      POSTGRES_PASSWORD: weye_dev_password
      POSTGRES_DB: weye
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weye"]
      interval: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
  voice-agent:
    build: ./voice-agent
    restart: on-failure
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      WEYE_API_URL: http://api:8000
      WEYE_STT_MODEL: ${WEYE_STT_MODEL:-nova-3}
      WEYE_LLM_MODEL: ${WEYE_LLM_MODEL:-gpt-4.1-mini}
      WEYE_TTS_MODEL: ${WEYE_TTS_MODEL:-sonic-2024-10-19}
    depends_on:
      - api
    profiles:
      - voice

volumes:
  postgres_data:

